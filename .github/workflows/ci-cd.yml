# Pull requests into main: build and run the test suite.
# Merge (push) to main: the same checks, then deploy the JAR to the Nsure server.
# Server side: Server/deploy in the Nsure workspace (deploy user, /usr/local/bin/nsure-deploy-be).
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Keep the JAR for deployment
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: nsure-be-jar
          path: target/nsure-be-*.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to server
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://129.151.189.55/
    concurrency:
      group: deploy-nsure-be
      cancel-in-progress: false
    env:
      DEPLOY_USER: deploy
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nsure-be-jar
          path: artifact

      # Logs only whether each secret is set; values are never printed (GitHub masks them as *** anyway).
      - name: Check deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=0
          for name in DEPLOY_HOST DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -n "${!name}" ]; then
              echo "$name: set"
            else
              echo "::error::$name is not set (Settings > Secrets and variables > Actions)"
              missing=1
            fi
          done
          [ "$missing" = 0 ]

      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Upload JAR
        run: |
          jar="$(ls artifact/nsure-be-*.jar | grep -v -- '-plain' | head -1)"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$jar" \
            "$DEPLOY_USER@${{ secrets.DEPLOY_HOST }}:incoming/nsure-be.jar"

      - name: Install and restart backend
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@${{ secrets.DEPLOY_HOST }}" sudo -n /usr/local/bin/nsure-deploy-be

      - name: Check the live site
        run: curl -fsS "http://${{ secrets.DEPLOY_HOST }}/api/actuator/health"
