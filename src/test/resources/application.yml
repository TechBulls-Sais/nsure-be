spring:
  datasource:
    url: jdbc:h2:mem:nsure;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        timezone:
          default_storage: NORMALIZE_UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

nsure:
  audit:
    system-user-id: 1
    max-command-json-length: 8000
  maker-checker:
    allow-same-user: false
