spring:
  datasource:
    url: jdbc:h2:mem:nsure-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        auto_quote_keyword: true
nsure:
  documents:
    dir: target/test-documents
  # Tests run the outbox dispatcher explicitly (POST /integration/outbox/dispatch), never on the timer.
  integration:
    dispatch-delay-ms: 3600000
  # The test installation's identity; each test database binds it on first start.
  insurer:
    code: test-insurer
    environment: test
    display-name: Test Insurer
    currency: BWP
    timezone: Africa/Gaborone
    primary-color: "#4e6c39"
    bind-on-first-start: true
