# Dev login seeded by Liquibase: username admin, password password.
# Local MySQL account created for this app: database nsure, user nsure, password nsure.
# Replace that hash in db/changelog/changes/004-seed-security.yaml before any shared environment.
spring:
  application:
    name: nsure-be
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/nsure?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: nsure
    password: nsure
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        timezone:
          default_storage: NORMALIZE_UTC
        auto_quote_keyword: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

server:
  # 8091, not 8080: MIPAS runs on 8080 on the same machine.
  port: 8091
  error:
    include-message: never
    include-binding-errors: never

nsure:
  maker-checker:
    same-user-allowed: false
  audit:
    max-payload-chars: 8000

management:
  endpoints:
    web:
      exposure:
        include: health
