# Shared environments (UAT, production). Credentials and identity must be supplied; nothing defaults.
spring:
  datasource:
    url: ${NSURE_DB_URL}
    username: ${NSURE_DB_USER}
    password: ${NSURE_DB_PASSWORD}
  liquibase:
    # The runtime account has no DDL rights; the migrate job applies schema changes before deployment.
    enabled: false

nsure:
  insurer:
    code: ${NSURE_INSURER_CODE}
    environment: ${NSURE_ENVIRONMENT}
    display-name: ${NSURE_INSURER_NAME}
    # Identity is bound by provisioning (the migrate job), never by an application that happens to start first.
    bind-on-first-start: false
  # Declaration codes go out through the messaging provider only; never in an API response.
  declaration:
    expose-otp: false
  payments:
    # Demonstration installations only. true lets the mock and the hosted-checkout simulator confirm payments, and
    # activate cover, exactly as in development; start-up logs a warning. Never on a live installation: no money is
    # received. Off (the default): Orange Money, MyZaka, Bank EFT and Card have no real provider yet and are refused.
    # Staff-recorded receipts work either way.
    demo: ${NSURE_DEMO_PAYMENTS:false}
    # Card payments go to the configured provider. Unset: NONE (refused), or SIMULATOR with demo payments on.
    # SIMULATOR and MOCK confirm money nobody paid, so they stop start-up unless demo payments are on.
    card-gateway: ${NSURE_CARD_GATEWAY:}
    public-base-url: ${NSURE_PUBLIC_BASE_URL}
    ui-base-url: ${NSURE_UI_BASE_URL}
  integration:
    # No simulated bank or wallet confirms money in a shared environment: unconfirmed receipts wait in suspense.
    provider-simulator: false
