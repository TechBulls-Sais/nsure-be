              - column: {name: name, type: varchar(100), constraints: {nullable: false}}
              - column: {name: email, type: varchar(150), constraints: {nullable: false}}
              - column: {name: phone, type: varchar(40), constraints: {nullable: false}}
              - column: {name: product, type: varchar(100)}
              - column: {name: policy_count, type: int, constraints: {nullable: false}}
              - column: {name: status, type: varchar(40), constraints: {nullable: false}}
              - column: {name: color, type: varchar(20), constraints: {nullable: false}}
              - column: {name: display_order, type: int, constraints: {nullable: false}}
        - createTable:
            tableName: ins_application
            columns:
