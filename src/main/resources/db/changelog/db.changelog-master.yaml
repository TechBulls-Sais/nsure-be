              - column: {name: ref, type: varchar(20), constraints: {nullable: false, unique: true}}
              - column: {name: customer_name, type: varchar(100), constraints: {nullable: false}}
              - column: {name: product, type: varchar(100), constraints: {nullable: false}}
              - column: {name: amount, type: int, constraints: {nullable: false}}
              - column: {name: premium, type: int, constraints: {nullable: false}}
              - column: {name: status, type: varchar(40), constraints: {nullable: false}}
              - column: {name: record_date, type: varchar(20), constraints: {nullable: false}}
              - column: {name: display_order, type: int, constraints: {nullable: false}}
              - column: {name: claim_type, type: varchar(80)}
              - column: {name: description, type: varchar(1000)}
              - column: {name: event_date, type: varchar(20)}
        - createTable:
            tableName: ins_product
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: name, type: varchar(100), constraints: {nullable: false, unique: true}}
              - column: {name: icon, type: varchar(40), constraints: {nullable: false}}
              - column: {name: color, type: varchar(20), constraints: {nullable: false}}
              - column: {name: description, type: varchar(300), constraints: {nullable: false}}
              - column: {name: cover, type: varchar(40), constraints: {nullable: false}}
              - column: {name: premium, type: varchar(20), constraints: {nullable: false}}
              - column: {name: live_count, type: int, constraints: {nullable: false}}
              - column: {name: display_order, type: int, constraints: {nullable: false}}
        - createTable:
            tableName: ins_scheme
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
