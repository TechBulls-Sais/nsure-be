databaseChangeLog:
  - changeSet:
      id: 045-support-and-compliance-roles
      author: nsure
      comment: >-
        The last two roles from the Nsure roles spec (04-roles-and-capabilities.md, roles 6 and 7). Grants follow the
        spec grant matrix (section 4) translated to permission codes, plus the codes the client matrix's core tasks
        need: grievances and message re-delivery for support, reports and the GL export for compliance.
        Customer Support Representative: claim.read/create, policy.read/create/write, payment.read (receipts sit
        under READ_POLICY), customer.read. Compliance & Auditor stays read-only apart from the GL export.
      changes:
        - sql:
            sql: |
              INSERT INTO app_role (name, description, disabled)
              SELECT 'Customer Support Representative', 'Call centre and helpdesk: searches customer policy profiles and transaction history, services policies, logs grievances and re-sends policy documents.', FALSE
              WHERE NOT EXISTS (SELECT 1 FROM app_role WHERE name = 'Customer Support Representative');

              INSERT INTO app_role (name, description, disabled)
              SELECT 'Compliance & Auditor', 'Internal and external auditors: read-only transaction logs and claims trails, regulatory reports, access logs and the finance GL export.', FALSE
              WHERE NOT EXISTS (SELECT 1 FROM app_role WHERE name = 'Compliance & Auditor');
        - sql:
            sql: |
              INSERT INTO app_role_permission (role_id, permission_id)
              SELECT r.id, p.id
              FROM app_role r
              JOIN app_permission p ON (
                   (r.name = 'Customer Support Representative' AND p.code IN (
                      'READ_CUSTOMER',
                      'READ_POLICY', 'CREATE_POLICY', 'UPDATE_POLICY',
                      'READ_CLAIM', 'CREATE_CLAIM',
                      'READ_SERVICE_CASE', 'MANAGE_SERVICE_CASE',
                      'READ_COMMUNICATION', 'MANAGE_COMMUNICATION'))
                OR (r.name = 'Compliance & Auditor' AND p.code IN (
                      'READ_CUSTOMER', 'READ_POLICY', 'READ_CLAIM',
                      'READ_AUDIT', 'READ_RATE_TABLE', 'READ_CONTROL',
                      'READ_REPORT', 'READ_FINANCE', 'EXPORT_GL'))
              )
              WHERE NOT EXISTS (SELECT 1 FROM app_role_permission x WHERE x.role_id = r.id AND x.permission_id = p.id);
  - changeSet:
      id: 045-support-and-compliance-demo-users
      author: nsure
      # Demonstration data: production installs run with contexts "!demo" and skip it.
      context: demo
      comment: One demo login per new role, password "password" (same hash as admin). Replace before any shared environment.
      changes:
        - sql:
            sql: |
              INSERT INTO app_user (username, password, enabled, office_id)
              SELECT seed.u, '$2a$10$dXJ3SW6G7P50lGmMkkmwe.20cQQubK3.HZWzG3YB1tlRy.fqvM/BG', TRUE, o.id
              FROM (SELECT 'support' u UNION ALL SELECT 'compliance') seed
              JOIN office o ON o.name = 'Head Office'
              WHERE NOT EXISTS (SELECT 1 FROM app_user x WHERE x.username = seed.u);

              INSERT INTO app_user_role (user_id, role_id)
              SELECT u.id, r.id
              FROM app_user u
              JOIN app_role r ON (
                   (u.username = 'support' AND r.name = 'Customer Support Representative')
                OR (u.username = 'compliance' AND r.name = 'Compliance & Auditor')
              )
              WHERE NOT EXISTS (SELECT 1 FROM app_user_role x WHERE x.user_id = u.id AND x.role_id = r.id);
