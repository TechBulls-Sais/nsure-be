databaseChangeLog:
  # IL05 Individual credit life (Nsure Life NS-IL05-001..006): a credit life policy linked to its loan and lender,
  # activated only on disbursement and first premium, serviced from the lender's authoritative balances, and closed by
  # claim or early settlement with a refund worked out by the product's formula.
  - changeSet:
      id: 073-credit-tables
      author: nsure
      changes:
        - createTable:
            tableName: crd_lender
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: record_ref, type: varchar(20), constraints: {nullable: false, unique: true, uniqueConstraintName: uk_crd_lender_ref}}
              - column: {name: name, type: varchar(150), constraints: {nullable: false, unique: true, uniqueConstraintName: uk_crd_lender_name}}
              - column: {name: contact_email, type: varchar(150)}
              - column: {name: active, type: boolean, defaultValueBoolean: true, constraints: {nullable: false}}
              - column: {name: created_by, type: varchar(100), constraints: {nullable: false}}
              - column: {name: created_at, type: timestamp(6), constraints: {nullable: false}}
        - createTable:
            tableName: crd_product_rule
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: product, type: varchar(60), constraints: {nullable: false, unique: true, uniqueConstraintName: uk_crd_rule_product}}
              - column: {name: min_entry_age, type: int, constraints: {nullable: false}}
              # Cover must end by this age; secured loans and pensioners may run to the exception age.
              - column: {name: max_exit_age, type: int, constraints: {nullable: false}}
              - column: {name: exception_exit_age, type: int, constraints: {nullable: false}}
              - column: {name: min_term_months, type: int, constraints: {nullable: false}}
              - column: {name: max_term_months, type: int, constraints: {nullable: false}}
              # Monthly premium per 1,000 of loan principal.
              - column: {name: rate_per_mille, type: 'decimal(9,4)', constraints: {nullable: false}}
              - column: {name: waiting_months, type: int, constraints: {nullable: false}}
              # STANDARD: permanent disability is part of every policy. OPTIONAL: only when elected.
              - column: {name: permanent_disability, type: varchar(20), constraints: {nullable: false}}
              - column: {name: temporary_disability_offered, type: boolean, constraints: {nullable: false}}
              - column: {name: critical_illness_offered, type: boolean, constraints: {nullable: false}}
              # OUTSTANDING_BALANCE: the benefit is the loan balance, paid to the lender. ORIGINAL_PRINCIPAL: the
              # benefit stays level and anything above the balance goes to the borrower's beneficiary or estate.
              - column: {name: cover_basis, type: varchar(30), constraints: {nullable: false}}
              # A balance older than this cannot settle a claim or an early settlement automatically.
              - column: {name: stale_balance_days, type: int, constraints: {nullable: false}}
              # Kept from the unearned premium on early settlement.
              - column: {name: refund_deduction_percent, type: 'decimal(7,2)', constraints: {nullable: false}}
              - column: {name: updated_by, type: varchar(100)}
              - column: {name: updated_at, type: timestamp(6)}
        - createTable:
            tableName: crd_loan
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: record_ref, type: varchar(20), constraints: {nullable: false, unique: true, uniqueConstraintName: uk_crd_loan_ref}}
              - column: {name: lender_ref, type: varchar(20), constraints: {nullable: false}}
              - column: {name: lender_loan_id, type: varchar(60), constraints: {nullable: false}}
              - column: {name: policy_ref, type: varchar(20)}
              - column: {name: customer_ref, type: varchar(40), constraints: {nullable: false}}
              - column: {name: borrower_name, type: varchar(150), constraints: {nullable: false}}
              - column: {name: product, type: varchar(60), constraints: {nullable: false}}
              - column: {name: principal, type: 'decimal(19,2)', constraints: {nullable: false}}
              - column: {name: term_months, type: int, constraints: {nullable: false}}
              - column: {name: secured, type: boolean, defaultValueBoolean: false, constraints: {nullable: false}}
              - column: {name: pensioner, type: boolean, defaultValueBoolean: false, constraints: {nullable: false}}
              - column: {name: premium_basis, type: varchar(20), constraints: {nullable: false}}
              - column: {name: monthly_premium, type: 'decimal(19,2)', constraints: {nullable: false}}
              - column: {name: single_premium, type: 'decimal(19,2)'}
              - column: {name: permanent_disability, type: boolean, constraints: {nullable: false}}
              - column: {name: temporary_disability, type: boolean, constraints: {nullable: false}}
              - column: {name: critical_illness, type: boolean, constraints: {nullable: false}}
              - column: {name: waiting_months, type: int, constraints: {nullable: false}}
              - column: {name: disbursement_date, type: date}
              - column: {name: disbursement_reference, type: varchar(80)}
              - column: {name: cover_start, type: date}
              - column: {name: status, type: varchar(30), constraints: {nullable: false}}
              # The lender's outstanding balance: the loan liability, never the premium receivable.
              - column: {name: balance, type: 'decimal(19,2)', constraints: {nullable: false}}
              - column: {name: balance_as_of, type: date}
              - column: {name: balance_exception, type: varchar(500)}
              - column: {name: settled_on, type: date}
              - column: {name: settlement_reference, type: varchar(80)}
              - column: {name: claim_ref, type: varchar(20)}
              - column: {name: claim_event_date, type: date}
              - column: {name: lender_amount, type: 'decimal(19,2)'}
              - column: {name: estate_amount, type: 'decimal(19,2)'}
              - column: {name: refinanced_from, type: varchar(20)}
              - column: {name: created_by, type: varchar(100), constraints: {nullable: false}}
              - column: {name: created_at, type: timestamp(6), constraints: {nullable: false}}
              - column: {name: row_version, type: bigint, defaultValueNumeric: 0, constraints: {nullable: false}}
        - addUniqueConstraint:
            tableName: crd_loan
            columnNames: lender_ref, lender_loan_id
            constraintName: uk_crd_loan_lender_id
        - createTable:
            tableName: crd_balance_update
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: loan_ref, type: varchar(20), constraints: {nullable: false}}
              - column: {name: source_reference, type: varchar(80), constraints: {nullable: false}}
              - column: {name: effective_date, type: date, constraints: {nullable: false}}
              - column: {name: balance, type: 'decimal(19,2)', constraints: {nullable: false}}
              - column: {name: status, type: varchar(20), constraints: {nullable: false}}
              - column: {name: note, type: varchar(500)}
              - column: {name: received_by, type: varchar(100), constraints: {nullable: false}}
              - column: {name: received_at, type: timestamp(6), constraints: {nullable: false}}
        - addUniqueConstraint:
            tableName: crd_balance_update
            columnNames: loan_ref, source_reference
            constraintName: uk_crd_balance_source
        - createTable:
            tableName: crd_refund
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: record_ref, type: varchar(20), constraints: {nullable: false, unique: true, uniqueConstraintName: uk_crd_refund_ref}}
              # One refund per loan, whatever is sent again.
              - column: {name: loan_ref, type: varchar(20), constraints: {nullable: false, unique: true, uniqueConstraintName: uk_crd_refund_loan}}
              - column: {name: policy_ref, type: varchar(20)}
              - column: {name: borrower_name, type: varchar(150)}
              - column: {name: amount, type: 'decimal(19,2)', constraints: {nullable: false}}
              - column: {name: formula, type: varchar(500), constraints: {nullable: false}}
              - column: {name: status, type: varchar(20), constraints: {nullable: false}}
              - column: {name: created_at, type: timestamp(6), constraints: {nullable: false}}
              - column: {name: paid_by, type: varchar(100)}
              - column: {name: paid_at, type: timestamp(6)}
              - column: {name: payment_reference, type: varchar(60)}
  - changeSet:
      id: 073-credit-seed
      author: nsure
      comment: >-
        The Individual Credit rule from the product sign-off (specification section 06): entry 18-65, cessation 65 with
        secured and pensioner exceptions to 80, terms 6-60 months, 3-month waiting period. The sign-off is contradictory
        on permanent disability, so it is a setting here (STANDARD). The rate and refund deduction are placeholders the
        insurer's approved tariff replaces (D02, D03).
      changes:
        - sql:
            sql: |
              INSERT INTO crd_product_rule (product, min_entry_age, max_exit_age, exception_exit_age, min_term_months,
                max_term_months, rate_per_mille, waiting_months, permanent_disability, temporary_disability_offered,
                critical_illness_offered, cover_basis, stale_balance_days, refund_deduction_percent, updated_by, updated_at)
              SELECT 'Individual Credit', 18, 65, 80, 6, 60, 0.8500, 3, 'STANDARD', TRUE, TRUE, 'ORIGINAL_PRINCIPAL', 45, 10.00, 'system', CURRENT_TIMESTAMP
              WHERE NOT EXISTS (SELECT 1 FROM crd_product_rule x WHERE x.product = 'Individual Credit');

              INSERT INTO app_permission (permission_group, code, entity_name, action_name, can_maker_checker, function_name)
              SELECT 'credit', seed.c, seed.e, seed.a, FALSE, seed.f FROM (
                SELECT 'READ_CREDIT' c, 'CREDIT' e, 'READ' a, 'View lenders, loans, balances and credit refunds' f UNION ALL
                SELECT 'MANAGE_CREDIT', 'CREDIT', 'MANAGE', 'Register lenders and loans, record disbursements, balances, claims and settlements' UNION ALL
                SELECT 'PAY_CREDIT_REFUND', 'CREDIT_REFUND', 'PAY', 'Pay an early-settlement premium refund' UNION ALL
                SELECT 'MANAGE_CREDIT_RULE', 'CREDIT_RULE', 'MANAGE', 'Maintain credit life product rules'
              ) seed
              WHERE NOT EXISTS (SELECT 1 FROM app_permission x WHERE x.code = seed.c);

              INSERT INTO app_role (name, description, disabled)
              SELECT 'Credit Life Administrator', 'Administers lender arrangements: loans, disbursements, balance updates, credit claims and early settlements.', FALSE
              WHERE NOT EXISTS (SELECT 1 FROM app_role WHERE name = 'Credit Life Administrator');

              INSERT INTO app_role_permission (role_id, permission_id)
              SELECT r.id, p.id FROM app_role r JOIN app_permission p ON (
                   (r.name = 'Super Admin' AND p.code IN ('READ_CREDIT', 'MANAGE_CREDIT', 'PAY_CREDIT_REFUND', 'MANAGE_CREDIT_RULE'))
                OR (r.name = 'Credit Life Administrator' AND p.code IN ('READ_DASHBOARD', 'READ_CUSTOMER', 'READ_POLICY',
                        'READ_APPLICATION', 'CREATE_POLICY', 'CREATE_APPLICATION', 'UPDATE_APPLICATION', 'READ_CREDIT',
                        'MANAGE_CREDIT', 'READ_SERVICING')))
              WHERE NOT EXISTS (SELECT 1 FROM app_role_permission x WHERE x.role_id = r.id AND x.permission_id = p.id);
  - changeSet:
      id: 073-credit-demo
      author: nsure
      context: demo
      comment: Demo lender and login for the Credit Life Administrator role, password "password" (same hash as admin).
      changes:
        - sql:
            sql: |
              INSERT INTO app_user (username, password, enabled)
              SELECT 'credit', '$2a$10$dXJ3SW6G7P50lGmMkkmwe.20cQQubK3.HZWzG3YB1tlRy.fqvM/BG', TRUE
              WHERE NOT EXISTS (SELECT 1 FROM app_user x WHERE x.username = 'credit');

              INSERT INTO app_user_role (user_id, role_id)
              SELECT u.id, r.id FROM app_user u JOIN app_role r ON r.name = 'Credit Life Administrator'
              WHERE u.username = 'credit'
                AND NOT EXISTS (SELECT 1 FROM app_user_role x WHERE x.user_id = u.id AND x.role_id = r.id);

              INSERT INTO crd_lender (record_ref, name, contact_email, active, created_by, created_at)
              SELECT 'LND-0001', 'Letshego Financial Services', 'insurance@letshego.example', TRUE, 'system', CURRENT_TIMESTAMP
              WHERE NOT EXISTS (SELECT 1 FROM crd_lender x WHERE x.record_ref = 'LND-0001');
