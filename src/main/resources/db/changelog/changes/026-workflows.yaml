databaseChangeLog:
  - changeSet:
      id: 026-product-periods
      author: nsure
      comment: >-
        The two product rules the policy and claim workflows read (demo server Insurance Product): days a claim
        must wait after cover starts, and days after a missed premium before the policy lapses.
      changes:
        - addColumn:
            tableName: ins_product
            columns:
              - column: {name: waiting_period_days, type: int, defaultValueNumeric: 30, constraints: {nullable: false}}
              - column: {name: grace_period_days, type: int, defaultValueNumeric: 14, constraints: {nullable: false}}
  - changeSet:
      id: 026-policy-lifecycle
      author: nsure
      comment: >-
        Policy lifecycle as on the demo server: Pending Payment until the first premium is collected (or the
        payment window passes and it expires), then Active with cover dates; past the grace period it lapses.
      changes:
        - addColumn:
            tableName: ins_policy
            columns:
              - column: {name: cover_start_date, type: date}
              - column: {name: next_premium_due, type: date}
              - column: {name: grace_period_end, type: date}
              - column: {name: payment_due_by, type: datetime}
              - column: {name: lapse_date, type: date}
              - column: {name: payment_method, type: varchar(40)}
        - createTable:
            tableName: ins_policy_beneficiary
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false, primaryKeyName: pk_ins_policy_beneficiary}}
              - column: {name: policy_id, type: bigint, constraints: {nullable: false}}
              - column: {name: full_name, type: varchar(200), constraints: {nullable: false}}
              - column: {name: relationship, type: varchar(80), constraints: {nullable: false}}
              - column: {name: national_id, type: varchar(40)}
              - column: {name: mobile, type: varchar(40)}
              - column: {name: payout_method, type: varchar(80)}
              - column: {name: account_ref, type: varchar(80)}
              - column: {name: is_primary, type: boolean, defaultValueBoolean: false, constraints: {nullable: false}}
              - column: {name: display_order, type: int, defaultValueNumeric: 0, constraints: {nullable: false}}
        - addForeignKeyConstraint:
            baseTableName: ins_policy_beneficiary
            baseColumnNames: policy_id
            referencedTableName: ins_policy
            referencedColumnNames: id
            constraintName: fk_beneficiary_policy
            onDelete: CASCADE
  - changeSet:
      id: 026-claim-lifecycle
      author: nsure
      comment: >-
        Claim lifecycle as on the demo server (claims/state_machine.py): lodged against a policy, five
        straight-through checks, a payee taken from the policy's beneficiaries, then assess, approve (four-eyes),
        reject with a reason, and pay.
      changes:
        - addColumn:
            tableName: ins_claim
            columns:
              - column: {name: policy_ref, type: varchar(20)}
              - column: {name: claimant_name, type: varchar(200)}
              - column: {name: claimant_mobile, type: varchar(40)}
              - column: {name: claimant_relationship, type: varchar(80)}
              - column: {name: processing_type, type: varchar(20)}
              - column: {name: stp_ineligible_reason, type: varchar(300)}
              - column: {name: check_policy_active, type: varchar(10)}
              - column: {name: check_waiting_period, type: varchar(10)}
              - column: {name: check_premiums_paid, type: varchar(10)}
              - column: {name: check_beneficiary_match, type: varchar(10)}
              - column: {name: check_no_duplicate, type: varchar(10)}
              - column: {name: payee_name, type: varchar(200)}
              - column: {name: payee_relationship, type: varchar(80)}
              - column: {name: payee_mobile, type: varchar(40)}
              - column: {name: payee_payout_method, type: varchar(80)}
              - column: {name: payee_account_ref, type: varchar(80)}
              - column: {name: payee_source, type: varchar(40)}
              - column: {name: payout_verified, type: boolean, defaultValueBoolean: false, constraints: {nullable: false}}
              - column: {name: payout_verified_by, type: varchar(100)}
              - column: {name: payout_verified_at, type: datetime}
              - column: {name: recommended_by, type: varchar(100)}
              - column: {name: recommended_by_id, type: bigint}
              - column: {name: recommended_at, type: datetime}
              - column: {name: adjudicated_by, type: varchar(100)}
              - column: {name: resolved_at, type: datetime}
              - column: {name: four_eyes_applied, type: boolean}
              - column: {name: rejection_reason, type: varchar(500)}
              - column: {name: payout_amount, type: int}
              - column: {name: payout_reference, type: varchar(60)}
              - column: {name: paid_at, type: datetime}
  - changeSet:
      id: 026-customer-review-reasons
      author: nsure
      comment: Why a customer's KYC or EDD review was rejected; the customer is told (demo server admin_review_customer_status).
      changes:
        - addColumn:
            tableName: ins_customer
            columns:
              - column: {name: kyc_rejection_reason, type: varchar(500)}
              - column: {name: edd_rejection_reason, type: varchar(500)}
  - changeSet:
      id: 026-workflow-log
      author: nsure
      comment: >-
        One row per workflow transition (demo server Activation Log): which record, what moved it from which
        state to which, who, when, and a readable summary.
      changes:
        - createTable:
            tableName: workflow_log
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false, primaryKeyName: pk_workflow_log}}
              - column: {name: entity_type, type: varchar(40), constraints: {nullable: false}}
              - column: {name: entity_ref, type: varchar(40), constraints: {nullable: false}}
              - column: {name: entity_label, type: varchar(200)}
              - column: {name: action_name, type: varchar(40), constraints: {nullable: false}}
              - column: {name: previous_state, type: varchar(40)}
              - column: {name: new_state, type: varchar(40)}
              - column: {name: details, type: varchar(1000)}
              - column: {name: performed_by, type: varchar(100), constraints: {nullable: false}}
              - column: {name: performed_at, type: datetime, constraints: {nullable: false}}
        - createIndex:
            tableName: workflow_log
            indexName: ix_workflow_log_entity
            columns:
              - column: {name: entity_type}
              - column: {name: entity_ref}
  - changeSet:
      id: 026-mysql-workflow-booleans
      author: nsure
      dbms: mysql
      comment: Liquibase maps boolean to tinyint on MySQL; Hibernate validates booleans as bit.
      changes:
        - modifyDataType: {tableName: ins_policy_beneficiary, columnName: is_primary, newDataType: bit}
        - addNotNullConstraint: {tableName: ins_policy_beneficiary, columnName: is_primary, columnDataType: bit, defaultNullValue: 0}
        - modifyDataType: {tableName: ins_claim, columnName: payout_verified, newDataType: bit}
        - addNotNullConstraint: {tableName: ins_claim, columnName: payout_verified, columnDataType: bit, defaultNullValue: 0}
        - modifyDataType: {tableName: ins_claim, columnName: four_eyes_applied, newDataType: bit}
  - changeSet:
      id: 026-workflow-permissions
      author: nsure
      comment: >-
        Claim workflow functions (demo server capabilities claim.assess / claim.approve / claim.reject, plus paying
        an approved claim). The Claims Assessor holds all four; four-eyes still stops one person both assessing
        and approving the same claim. Policies are no longer accepted by staff - they go Active when paid - so
        APPROVE_POLICY is retired.
      changes:
        - sql:
            sql: |
              INSERT INTO app_permission (permission_group, code, entity_name, action_name, can_maker_checker, function_name)
              SELECT 'portfolio', 'ASSESS_CLAIM', 'CLAIM', 'ASSESS', FALSE, 'Assess a claim and recommend it for approval'
              WHERE NOT EXISTS (SELECT 1 FROM app_permission WHERE code = 'ASSESS_CLAIM');

              INSERT INTO app_permission (permission_group, code, entity_name, action_name, can_maker_checker, function_name)
              SELECT 'portfolio', 'APPROVE_CLAIM', 'CLAIM', 'APPROVE', FALSE, 'Approve a recommended claim for payout'
              WHERE NOT EXISTS (SELECT 1 FROM app_permission WHERE code = 'APPROVE_CLAIM');

              INSERT INTO app_permission (permission_group, code, entity_name, action_name, can_maker_checker, function_name)
              SELECT 'portfolio', 'REJECT_CLAIM', 'CLAIM', 'REJECT', FALSE, 'Reject a claim with a reason'
              WHERE NOT EXISTS (SELECT 1 FROM app_permission WHERE code = 'REJECT_CLAIM');

              INSERT INTO app_permission (permission_group, code, entity_name, action_name, can_maker_checker, function_name)
              SELECT 'portfolio', 'SETTLE_CLAIM', 'CLAIM', 'SETTLE', FALSE, 'Pay out an approved claim'
              WHERE NOT EXISTS (SELECT 1 FROM app_permission WHERE code = 'SETTLE_CLAIM');

              INSERT INTO app_role_permission (role_id, permission_id)
              SELECT r.id, p.id
              FROM app_role r
              JOIN app_permission p ON p.code IN ('ASSESS_CLAIM', 'APPROVE_CLAIM', 'REJECT_CLAIM', 'SETTLE_CLAIM')
              WHERE r.name = 'Claims Assessor'
                AND NOT EXISTS (SELECT 1 FROM app_role_permission x WHERE x.role_id = r.id AND x.permission_id = p.id);

              DELETE FROM app_role_permission
              WHERE permission_id IN (SELECT id FROM app_permission WHERE code = 'APPROVE_POLICY');
              DELETE FROM app_permission WHERE code = 'APPROVE_POLICY';
  - changeSet:
      id: 026-assessor-user
      author: nsure
      comment: >-
        Dev login for the Claims Assessor (password: password), so a claim can be assessed by one person and
        approved by another (admin) with four-eyes on.
      changes:
        - sql:
            sql: |
              INSERT INTO app_user (username, password, enabled, office_id)
              SELECT 'assessor', '$2a$10$dXJ3SW6G7P50lGmMkkmwe.20cQQubK3.HZWzG3YB1tlRy.fqvM/BG', TRUE, id
              FROM office WHERE name = 'Head Office'
                AND NOT EXISTS (SELECT 1 FROM app_user WHERE username = 'assessor');

              INSERT INTO app_user_role (user_id, role_id)
              SELECT u.id, r.id
              FROM app_user u
              JOIN app_role r ON r.name = 'Claims Assessor'
              WHERE u.username = 'assessor'
                AND NOT EXISTS (SELECT 1 FROM app_user_role x WHERE x.user_id = u.id AND x.role_id = r.id);
  - changeSet:
      id: 026-legacy-states-h2
      author: nsure
      dbms: h2
      comment: Moves the earlier free-text statuses onto the demo server's workflow states, with cover dates for live policies.
      changes:
        - sql:
            sql: |
              UPDATE ins_policy SET status = 'Pending Payment' WHERE status = 'Pending approval';
              UPDATE ins_policy SET status = 'Cancelled' WHERE status = 'Rejected';
              UPDATE ins_claim SET status = 'Under Review' WHERE status IN ('Assessment', 'Evidence needed');
              UPDATE ins_claim SET status = 'Paid' WHERE status = 'Settled';
              UPDATE ins_claim SET policy_ref = (
                SELECT MIN(p.record_ref) FROM ins_policy p
                WHERE p.customer_name = ins_claim.customer_name AND p.product = ins_claim.product)
              WHERE policy_ref IS NULL;
              UPDATE ins_claim SET claimant_name = customer_name WHERE claimant_name IS NULL;
              UPDATE ins_claim SET processing_type = 'Manual Review' WHERE processing_type IS NULL;
              UPDATE ins_claim SET payout_amount = amount WHERE status IN ('Approved', 'Paid') AND payout_amount IS NULL;
              UPDATE ins_claim SET payee_name = customer_name, payee_relationship = 'Policyholder',
                payee_payout_method = 'Bank Account', payee_account_ref = 'On file', payee_source = 'Registered Beneficiary',
                payout_verified = TRUE, payout_verified_by = 'admin'
              WHERE status IN ('Approved', 'Paid') AND payee_name IS NULL;
        - sql:
            sql: |
              UPDATE ins_policy SET status = 'Active',
                cover_start_date = DATEADD('MONTH', -3, CURRENT_DATE),
                next_premium_due = DATEADD('DAY', 20, CURRENT_DATE),
                grace_period_end = DATEADD('DAY', 34, CURRENT_DATE)
              WHERE status IN ('In force', 'Active');
              UPDATE ins_policy SET status = 'Active',
                cover_start_date = DATEADD('MONTH', -4, CURRENT_DATE),
                next_premium_due = DATEADD('DAY', -5, CURRENT_DATE),
                grace_period_end = DATEADD('DAY', 9, CURRENT_DATE)
              WHERE status = 'Grace period';
              UPDATE ins_policy SET
                cover_start_date = DATEADD('MONTH', -8, CURRENT_DATE),
                next_premium_due = DATEADD('MONTH', -2, CURRENT_DATE),
                grace_period_end = DATEADD('DAY', 14, DATEADD('MONTH', -2, CURRENT_DATE)),
                lapse_date = DATEADD('DAY', 15, DATEADD('MONTH', -2, CURRENT_DATE))
              WHERE status = 'Lapsed';
  - changeSet:
      id: 026-legacy-states-mysql
      author: nsure
      dbms: mysql
      comment: Moves the earlier free-text statuses onto the demo server's workflow states, with cover dates for live policies.
      changes:
        - sql:
            sql: |
              UPDATE ins_policy SET status = 'Pending Payment' WHERE status = 'Pending approval';
              UPDATE ins_policy SET status = 'Cancelled' WHERE status = 'Rejected';
              UPDATE ins_claim SET status = 'Under Review' WHERE status IN ('Assessment', 'Evidence needed');
              UPDATE ins_claim SET status = 'Paid' WHERE status = 'Settled';
              UPDATE ins_claim SET policy_ref = (
                SELECT MIN(p.record_ref) FROM ins_policy p
                WHERE p.customer_name = ins_claim.customer_name AND p.product = ins_claim.product)
              WHERE policy_ref IS NULL;
              UPDATE ins_claim SET claimant_name = customer_name WHERE claimant_name IS NULL;
              UPDATE ins_claim SET processing_type = 'Manual Review' WHERE processing_type IS NULL;
              UPDATE ins_claim SET payout_amount = amount WHERE status IN ('Approved', 'Paid') AND payout_amount IS NULL;
              UPDATE ins_claim SET payee_name = customer_name, payee_relationship = 'Policyholder',
                payee_payout_method = 'Bank Account', payee_account_ref = 'On file', payee_source = 'Registered Beneficiary',
                payout_verified = TRUE, payout_verified_by = 'admin'
              WHERE status IN ('Approved', 'Paid') AND payee_name IS NULL;
        - sql:
            sql: |
              UPDATE ins_policy SET status = 'Active',
                cover_start_date = DATE_SUB(CURRENT_DATE, INTERVAL 3 MONTH),
                next_premium_due = DATE_ADD(CURRENT_DATE, INTERVAL 20 DAY),
                grace_period_end = DATE_ADD(CURRENT_DATE, INTERVAL 34 DAY)
              WHERE status IN ('In force', 'Active');
              UPDATE ins_policy SET status = 'Active',
                cover_start_date = DATE_SUB(CURRENT_DATE, INTERVAL 4 MONTH),
                next_premium_due = DATE_SUB(CURRENT_DATE, INTERVAL 5 DAY),
                grace_period_end = DATE_ADD(CURRENT_DATE, INTERVAL 9 DAY)
              WHERE status = 'Grace period';
              UPDATE ins_policy SET
                cover_start_date = DATE_SUB(CURRENT_DATE, INTERVAL 8 MONTH),
                next_premium_due = DATE_SUB(CURRENT_DATE, INTERVAL 2 MONTH),
                grace_period_end = DATE_ADD(DATE_SUB(CURRENT_DATE, INTERVAL 2 MONTH), INTERVAL 14 DAY),
                lapse_date = DATE_ADD(DATE_SUB(CURRENT_DATE, INTERVAL 2 MONTH), INTERVAL 15 DAY)
              WHERE status = 'Lapsed';
