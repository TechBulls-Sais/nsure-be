databaseChangeLog:
  - changeSet:
      id: 043-single-super-admin-role
      author: nsure
      comment: >-
        One top role instead of two. "Super user" becomes "Super Admin": the old Super Admin role is removed, everyone
        who held either role holds the merged one, and it is granted every permission (it already passes every check by
        name). The merged role is the protected one: it cannot be renamed, disabled, deleted or lose ALL_FUNCTIONS.
      changes:
        - sql:
            sql: |
              -- Everyone who held the old Super Admin role keeps top access through the role that stays.
              INSERT INTO app_user_role (user_id, role_id)
              SELECT ur.user_id, su.id
              FROM app_user_role ur
              JOIN app_role old_admin ON old_admin.id = ur.role_id AND old_admin.name = 'Super Admin'
              JOIN app_role su ON su.name = 'Super user'
              WHERE NOT EXISTS (
                  SELECT 1 FROM app_user_role x WHERE x.user_id = ur.user_id AND x.role_id = su.id);
        - sql:
            sql: |
              DELETE FROM app_user_role
              WHERE role_id IN (SELECT id FROM app_role WHERE name = 'Super Admin');
        - sql:
            sql: |
              DELETE FROM app_role_permission
              WHERE role_id IN (SELECT id FROM app_role WHERE name = 'Super Admin');
        - sql:
            sql: |
              DELETE FROM app_role WHERE name = 'Super Admin';
        - sql:
            sql: |
              UPDATE app_role
              SET name = 'Super Admin',
                  description = 'Full platform access: every permission, user and role management, and final maker-checker approval.'
              WHERE name = 'Super user';
        - sql:
            sql: |
              INSERT INTO app_role_permission (role_id, permission_id)
              SELECT r.id, p.id
              FROM app_role r
              CROSS JOIN app_permission p
              WHERE r.name = 'Super Admin'
                AND NOT EXISTS (
                    SELECT 1 FROM app_role_permission x WHERE x.role_id = r.id AND x.permission_id = p.id);
