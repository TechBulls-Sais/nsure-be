databaseChangeLog:
  # NS-SH05-003 (test B-10): a claim may be approved while mandatory evidence is still outstanding only with a written
  # reason, kept on the claim.
  - changeSet:
      id: 085-claim-evidence-override-reason
      author: nsure
      changes:
        - addColumn:
            tableName: ins_claim
            columns:
              - column: {name: evidence_override_reason, type: varchar(500)}
