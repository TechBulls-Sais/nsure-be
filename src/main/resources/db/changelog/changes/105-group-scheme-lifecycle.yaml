databaseChangeLog:
  # Scheme suspension, closure and transfer act on member cover (NS-GL01-006, AT-GL01-03): a suspended member keeps
  # the status to return to and the suspended dates (not covered, not billed), a lifecycle request keeps the full
  # impact it was approved on and the target of a transfer, and group claims are recorded against the member's cover
  # episode so a closure or renewal reports the claims still pending.
  - changeSet:
      id: 105-group-scheme-lifecycle
      author: nsure
      changes:
        - addColumn:
            tableName: grp_member
            columns:
              - column: {name: status_before_suspension, type: varchar(30)}
              - column: {name: suspended_from, type: date}
              - column: {name: suspended_until, type: date}
        - addColumn:
            tableName: grp_scheme_event
            columns:
              - column: {name: target_scheme_ref, type: varchar(20)}
              - column: {name: impact_detail, type: clob}
        - createTable:
            tableName: grp_claim
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false, primaryKeyName: pk_grp_claim}}
              - column: {name: record_ref, type: varchar(20), constraints: {nullable: false, unique: true, uniqueConstraintName: uk_grp_claim_ref}}
              - column: {name: scheme_id, type: bigint, constraints: {nullable: false}}
              - column: {name: member_id, type: bigint, constraints: {nullable: false}}
              - column: {name: benefit_type, type: varchar(30), constraints: {nullable: false}}
              - column: {name: event_date, type: date, constraints: {nullable: false}}
              - column: {name: claimed_amount, type: 'decimal(15,2)', constraints: {nullable: false}}
              - column: {name: approved_amount, type: 'decimal(15,2)'}
              - column: {name: claim_status, type: varchar(20), constraints: {nullable: false}}
              - column: {name: next_review_date, type: date}
              - column: {name: payment_reference, type: varchar(80)}
              - column: {name: note, type: varchar(500)}
              - column: {name: notified_by, type: varchar(100), constraints: {nullable: false}}
              - column: {name: notified_at, type: timestamp(6), constraints: {nullable: false}}
              - column: {name: decided_by, type: varchar(100)}
              - column: {name: decided_at, type: timestamp(6)}
              - column: {name: updated_by, type: varchar(100), constraints: {nullable: false}}
              - column: {name: updated_at, type: timestamp(6), constraints: {nullable: false}}
        - addForeignKeyConstraint:
            baseTableName: grp_claim
            baseColumnNames: scheme_id
            referencedTableName: ins_scheme
            referencedColumnNames: id
            constraintName: fk_grp_claim_scheme
        - addForeignKeyConstraint:
            baseTableName: grp_claim
            baseColumnNames: member_id
            referencedTableName: grp_member
            referencedColumnNames: id
            constraintName: fk_grp_claim_member
        - createIndex:
            tableName: grp_claim
            indexName: ix_grp_claim_scheme_status
            columns:
              - column: {name: scheme_id}
              - column: {name: claim_status}
