databaseChangeLog:
  - changeSet:
      id: 011-operational-controls
      author: nsure
      changes:
        - createTable:
            tableName: operational_control
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: control_key, type: varchar(60), constraints: {nullable: false, unique: true}}
              - column: {name: name, type: varchar(140), constraints: {nullable: false}}
              - column: {name: description, type: varchar(1000), constraints: {nullable: false}}
              - column: {name: control_type, type: varchar(20), constraints: {nullable: false}}
              - column: {name: enabled, type: boolean, constraints: {nullable: false}}
              - column: {name: numeric_value, type: "decimal(15,2)"}
              - column: {name: fail_mode, type: varchar(10), constraints: {nullable: false}}
              - column: {name: min_value, type: "decimal(15,2)"}
              - column: {name: max_value, type: "decimal(15,2)"}
              - column: {name: requires_reason, type: boolean, defaultValueBoolean: true, constraints: {nullable: false}}
              - column: {name: last_changed_by, type: bigint}
              - column: {name: last_changed_at, type: timestamp(6)}
              - column: {name: last_change_reason, type: varchar(1000)}
        - addForeignKeyConstraint:
            baseTableName: operational_control
            baseColumnNames: last_changed_by
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_control_changed_by
        - createTable:
            tableName: operational_control_history
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: control_key, type: varchar(60), constraints: {nullable: false}}
              - column: {name: previous_enabled, type: boolean}
              - column: {name: new_enabled, type: boolean}
              - column: {name: previous_value, type: "decimal(15,2)"}
              - column: {name: new_value, type: "decimal(15,2)"}
              - column: {name: changed_by, type: bigint, constraints: {nullable: false}}
              - column: {name: changed_at, type: timestamp(6), constraints: {nullable: false}}
              - column: {name: reason, type: varchar(1000), constraints: {nullable: false}}
        - addForeignKeyConstraint:
            baseTableName: operational_control_history
            baseColumnNames: changed_by
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_control_history_user
        - sql:
            sql: |
              INSERT INTO operational_control
                (control_key, name, description, control_type, enabled, numeric_value, fail_mode, min_value, max_value, requires_reason)
              VALUES
                ('claim.four_eyes', 'Claim four-eyes', 'The assessor may not approve their own claim.', 'TOGGLE', TRUE, NULL, 'CLOSED', NULL, NULL, TRUE),
                ('claim.stp_enabled', 'Straight-through processing', 'Master switch for automatic claim approval.', 'TOGGLE', TRUE, NULL, 'CLOSED', NULL, NULL, TRUE),
                ('claim.stp_ceiling', 'STP ceiling', 'Maximum payout eligible for straight-through processing.', 'THRESHOLD', TRUE, 5000.00, 'CLOSED', 0, 1000000, TRUE),
                ('claim.stp_requires_verified_payout', 'STP requires verified payout', 'STP requires a verified payout account.', 'TOGGLE', TRUE, NULL, 'CLOSED', NULL, NULL, TRUE),
                ('rate.four_eyes', 'Rate four-eyes', 'The author may not publish their own rate version.', 'TOGGLE', TRUE, NULL, 'CLOSED', NULL, NULL, TRUE),
                ('rate.notice_days', 'Re-rate notice', 'Minimum notice before a re-rate takes effect.', 'DURATION', TRUE, 90, 'CLOSED', 0, 365, TRUE),
                ('policy.payment_window_hours', 'Pending payment window', 'Hours a pending policy waits for payment.', 'DURATION', TRUE, 24, 'CLOSED', 1, 168, TRUE),
                ('declaration.otp_max_attempts', 'Declaration OTP attempts', 'Failed OTP attempts before lockout.', 'THRESHOLD', TRUE, 3, 'CLOSED', 1, 10, TRUE),
                ('declaration.otp_lock_minutes', 'Declaration OTP lock', 'Minutes a declaration stays locked.', 'DURATION', TRUE, 30, 'CLOSED', 1, 1440, TRUE),
                ('payment.settlement_tamper_check', 'Settlement tamper check', 'Re-check amount and currency before activation.', 'TOGGLE', TRUE, NULL, 'CLOSED', NULL, NULL, TRUE);
