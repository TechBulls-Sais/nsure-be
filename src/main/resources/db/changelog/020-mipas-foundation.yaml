databaseChangeLog:
  - changeSet:
      id: 020-mipas-reference-tables
      author: nsure
      comment: MiPAS reference data from spec 05 sections 2. Changeset numbers continue after the existing Nsure changelog.
      changes:
        - createTable:
            tableName: premium_frequency
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false, primaryKeyName: pk_premium_frequency}}
              - column: {name: frequency_name, type: varchar(50), constraints: {nullable: false, unique: true, uniqueConstraintName: uk_premium_frequency_name}}
              - column: {name: months, type: int, constraints: {nullable: false}}
              - column: {name: short_label, type: varchar(20)}
              - column: {name: period_word, type: varchar(20)}
              - column: {name: display_order, type: int, constraints: {nullable: false}}
        - createTable:
            tableName: relationship_type
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false, primaryKeyName: pk_relationship_type}}
              - column: {name: relationship_name, type: varchar(80), constraints: {nullable: false, unique: true, uniqueConstraintName: uk_relationship_type_name}}
              - column: {name: display_order, type: int, constraints: {nullable: false}}
              - column: {name: is_self_relationship, type: boolean, defaultValueBoolean: false, constraints: {nullable: false}}
        - createTable:
            tableName: courtesy
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false, primaryKeyName: pk_courtesy}}
              - column: {name: name, type: varchar(50), constraints: {nullable: false, unique: true, uniqueConstraintName: uk_courtesy_name}}
        - createTable:
            tableName: proof_of_identity
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false, primaryKeyName: pk_proof_of_identity}}
              - column: {name: name, type: varchar(50), constraints: {nullable: false, unique: true, uniqueConstraintName: uk_proof_of_identity_name}}
        - createTable:
            tableName: payout_method
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false, primaryKeyName: pk_payout_method}}
              - column: {name: name, type: varchar(50), constraints: {nullable: false, unique: true, uniqueConstraintName: uk_payout_method_name}}
        - createTable:
            tableName: gender
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false, primaryKeyName: pk_gender}}
              - column: {name: name, type: varchar(50), constraints: {nullable: false, unique: true, uniqueConstraintName: uk_gender_name}}
        - createTable:
            tableName: relationship_screen_filter
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false, primaryKeyName: pk_relationship_screen_filter}}
              - column: {name: screen, type: varchar(60), constraints: {nullable: false, unique: true, uniqueConstraintName: uk_relationship_screen}}
              - column: {name: screen_label, type: varchar(120)}
        - createTable:
            tableName: relationship_screen_filter_item
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false, primaryKeyName: pk_relationship_screen_filter_item}}
              - column: {name: filter_id, type: bigint, constraints: {nullable: false}}
              - column: {name: relationship_type_id, type: bigint, constraints: {nullable: false}}
              - column: {name: display_order, type: int, defaultValueNumeric: 0, constraints: {nullable: false}}
        - addUniqueConstraint:
            tableName: relationship_screen_filter_item
            columnNames: filter_id, relationship_type_id
            constraintName: uk_screen_filter_relationship
        - addForeignKeyConstraint:
            constraintName: fk_screen_filter_item_filter
            baseTableName: relationship_screen_filter_item
            baseColumnNames: filter_id
            referencedTableName: relationship_screen_filter
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_screen_filter_item_relationship
            baseTableName: relationship_screen_filter_item
            baseColumnNames: relationship_type_id
            referencedTableName: relationship_type
            referencedColumnNames: id

  - changeSet:
      id: 021-mipas-reference-seed
      author: nsure
      changes:
        - sqlFile:
            path: seed/021-reference-seed.sql
            relativeToChangelogFile: true
            splitStatements: true

  - changeSet:
      id: 022-mipas-operational-controls
      author: nsure
      comment: Fail-closed control registry from spec 12. Every control starts enabled.
      changes:
        - createTable:
            tableName: operational_control
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false, primaryKeyName: pk_operational_control}}
              - column: {name: control_key, type: varchar(60), constraints: {nullable: false, unique: true, uniqueConstraintName: uk_operational_control_key}}
              - column: {name: name, type: varchar(140), constraints: {nullable: false}}
              - column: {name: description, type: varchar(500), constraints: {nullable: false}}
              - column: {name: control_type, type: varchar(20), constraints: {nullable: false}}
              - column: {name: enabled, type: boolean, constraints: {nullable: false}}
              - column: {name: numeric_value, type: "decimal(15,2)"}
              - column: {name: fail_mode, type: varchar(10), constraints: {nullable: false}}
              - column: {name: min_value, type: "decimal(15,2)"}
              - column: {name: max_value, type: "decimal(15,2)"}
              - column: {name: requires_reason, type: boolean, defaultValueBoolean: true, constraints: {nullable: false}}
              - column: {name: last_changed_by, type: bigint}
              - column: {name: last_changed_at, type: datetime}
              - column: {name: last_change_reason, type: varchar(500)}
        - createTable:
            tableName: operational_control_history
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false, primaryKeyName: pk_operational_control_history}}
              - column: {name: control_key, type: varchar(60), constraints: {nullable: false}}
              - column: {name: previous_enabled, type: boolean}
              - column: {name: new_enabled, type: boolean}
              - column: {name: previous_value, type: "decimal(15,2)"}
              - column: {name: new_value, type: "decimal(15,2)"}
              - column: {name: changed_by, type: bigint, constraints: {nullable: false}}
              - column: {name: changed_at, type: datetime, constraints: {nullable: false}}
              - column: {name: reason, type: varchar(500), constraints: {nullable: false}}
        - addForeignKeyConstraint:
            constraintName: fk_operational_control_changed_by
            baseTableName: operational_control
            baseColumnNames: last_changed_by
            referencedTableName: app_user
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_operational_control_history_user
            baseTableName: operational_control_history
            baseColumnNames: changed_by
            referencedTableName: app_user
            referencedColumnNames: id
        - sql:
            sql: "ALTER TABLE operational_control ADD CONSTRAINT ck_operational_control_value CHECK (control_type = 'TOGGLE' OR numeric_value IS NOT NULL)"
        - sqlFile:
            path: seed/022-operational-controls.sql
            relativeToChangelogFile: true
            splitStatements: true

  - changeSet:
      id: 023-mipas-capabilities
      author: nsure
      comment: Seven MiPAS roles and the closed capability vocabulary. Policyholder receives no grants.
      changes:
        - createTable:
            tableName: mipas_capability
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false, primaryKeyName: pk_mipas_capability}}
              - column: {name: code, type: varchar(60), constraints: {nullable: false, unique: true, uniqueConstraintName: uk_mipas_capability_code}}
              - column: {name: capability_group, type: varchar(40), constraints: {nullable: false}}
              - column: {name: meaning, type: varchar(300), constraints: {nullable: false}}
        - createTable:
            tableName: mipas_capability_grant
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false, primaryKeyName: pk_mipas_capability_grant}}
              - column: {name: role_id, type: bigint, constraints: {nullable: false}}
              - column: {name: capability_id, type: bigint, constraints: {nullable: false}}
        - addUniqueConstraint:
            tableName: mipas_capability_grant
            columnNames: role_id, capability_id
            constraintName: uk_mipas_capability_grant
        - addForeignKeyConstraint:
            constraintName: fk_mipas_grant_role
            baseTableName: mipas_capability_grant
            baseColumnNames: role_id
            referencedTableName: app_role
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_mipas_grant_capability
            baseTableName: mipas_capability_grant
            baseColumnNames: capability_id
            referencedTableName: mipas_capability
            referencedColumnNames: id
        - sqlFile:
            path: seed/023-capabilities.sql
            relativeToChangelogFile: true
            splitStatements: true

  - changeSet:
      id: 024-mysql-mipas-column-types
      author: nsure
      dbms: mysql
      comment: Hibernate expects bit and datetime(6) on MySQL.
      changes:
        - modifyDataType: {tableName: relationship_type, columnName: is_self_relationship, newDataType: bit}
        - modifyDataType: {tableName: operational_control, columnName: enabled, newDataType: bit}
        - modifyDataType: {tableName: operational_control, columnName: requires_reason, newDataType: bit}
        - modifyDataType: {tableName: operational_control, columnName: last_changed_at, newDataType: datetime(6)}
        - modifyDataType: {tableName: operational_control_history, columnName: previous_enabled, newDataType: bit}
        - modifyDataType: {tableName: operational_control_history, columnName: new_enabled, newDataType: bit}
        - modifyDataType: {tableName: operational_control_history, columnName: changed_at, newDataType: datetime(6)}
